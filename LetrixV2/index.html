<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letrix – Aprenda palavras brincando!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Música de fundo -->
  <audio id="musica-fundo" loop>
    <source src="The_Toybox_Sprint.mp3" type="audio/mp3">
  </audio>
  <!-- Música de fundo -->

  <div class="bg-bubbles">
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
  </div>

  <div class="floating-letters">
    <span class="fl">A</span><span class="fl">B</span><span class="fl">C</span><span class="fl">D</span>
    <span class="fl">E</span><span class="fl">Z</span><span class="fl">M</span><span class="fl">P</span>
  </div>

  <div class="hero">
    <div class="logo-wrap">
      <span class="logo-letter">L</span><span class="logo-letter">E</span><span class="logo-letter">T</span>
      <span class="logo-letter">R</span><span class="logo-letter">I</span><span class="logo-letter">X</span>
      <span class="logo-star">⭐</span>
    </div>

    <p class="tagline">Aprenda palavras brincando!</p>

    <div class="game-preview">
      <div class="preview-label">Como funciona</div>
      <div class="image-box"><span class="image-emoji">🦁</span></div>

      <div class="word-slots">
        <div class="slot filled">L</div>
        <div class="slot filled">E</div>
        <div class="slot filled">Ã</div>
        <div class="slot"></div>
      </div>

      <div class="letter-choices">
        <div class="lc lc-used">L</div><div class="lc lc-used">E</div>
        <div class="lc lc-used">Ã</div><div class="lc">O</div>
        <div class="lc">X</div><div class="lc">V</div>
      </div>
    </div>

<div class="cta-area">
  <div class="game-modes">
    <button class="btn-play" onclick="window.location.href='jogar.html'">
      <span class="btn-icon">🔤</span> Letrix Palavras
    </button>
    
    <button class="btn-play mode-drag" onclick="window.location.href='drag.html'">
      <span class="btn-icon">🎯</span> Letrix Arrastar
    </button>
  </div>

  <div class="secondary-btns">
    <button class="btn-creditos" onclick="window.location.href='creditos.html'">
      ℹ️ Créditos
    </button>

    <button class="btn-som" id="btn-som" onclick="toggleMusica()">
      🔇
    </button>
  </div>
</div>

<script>
  const musica = document.getElementById("musica-fundo");
  const btnSom = document.getElementById("btn-som");
  let tocando = false;

  function toggleMusica() {
    if (!tocando) {
      musica.play().catch(e => console.log("O navegador bloqueou o som inicial. Clique novamente."));
      tocando = true;
      btnSom.textContent = "🔊";
      btnSom.style.background = "#55EFC4"; // Muda cor quando ativo
    } else {
      musica.pause();
      tocando = false;
      btnSom.textContent = "🔇";
      btnSom.style.background = "#ff7e5f";
    }
  }
</script>
  </body>
</html>
