<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letrix – Aprenda palavras brincando!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <audio id="musica-fundo" loop>
    <source src="The_Toybox_Sprint.mp3" type="audio/mp3">
  </audio>

  <div class="bg-bubbles">
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
  </div>

  <div class="floating-letters">
    <span class="fl" style="animation-delay: 0s;">A</span>
    <span class="fl" style="animation-delay: 1s;">B</span>
    <span class="fl" style="animation-delay: 2s;">C</span>
  </div>

  <div class="cta-area">
    <div class="logo-home-container">
    <img src="logo.png" alt="Logo Letrix" class="logo-inicial">
    </div>
    <div class="game-modes">
      <button class="btn-play" onclick="window.location.href='jogar.html'">
        <span class="btn-icon">🔤</span> Letrix Palavras
      </button>
      
      <button class="btn-play mode-drag" onclick="window.location.href='drag.html'">
        <span class="btn-icon">🎯</span> Letrix Arrastar
      </button>

      <button class="btn-play" onclick="window.location.href='memoria.html'" style="background: linear-gradient(135deg, #74B9FF, #0984e3); box-shadow: 0 8px 0 #0984e3, 0 12px 20px rgba(0,0,0,0.1);">
      <span class="btn-icon">🧩</span> Letrix Memória
      </button>

    </div>

    <div class="secondary-btns">
      <button class="btn-creditos" onclick="window.location.href='creditos.html'">
        ℹ️ Créditos
      </button>
      <button class="btn-creditos" onclick="window.location.href='dashboard.html'" style="background-color: #6c5ce7; color: white; border-color: #6c5ce7;">
        📊 Relatório
      </button>
      <button class="btn-som" id="btn-som" onclick="toggleMusica()">🔇</button>
    </div>
  </div>

  <script>
    const musica = document.getElementById("musica-fundo");
    const btnSom = document.getElementById("btn-som");
    let tocando = false;

    function toggleMusica() {
      if (!tocando) {
        musica.play();
        btnSom.textContent = "🔊";
        tocando = true;
      } else {
        musica.pause();
        btnSom.textContent = "🔇";
        tocando = false;
      }
    }
  </script>
</body>
</html>
