<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Metadados do documento -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letrix – Aprenda palavras brincando!</title>
  
  <!-- Vinculação do Manifesto Web PWA para o instalador e PWABuilder -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6c5ce7">
  
  <!-- Importação de fontes do Google Fonts (Fredoka One e Nunito) para visual lúdico -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Link para a folha de estilo principal do menu inicial -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Bolhas decorativas flutuantes no fundo da tela (efeito CSS) -->
  <div class="bg-bubbles">
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
  </div>

  <!-- Letras flutuantes decorativas no fundo que complementam o tema de alfabetização -->
  <div class="floating-letters">
    <span class="fl">A</span><span class="fl">B</span><span class="fl">C</span><span class="fl">D</span>
    <span class="fl">E</span><span class="fl">Z</span><span class="fl">M</span><span class="fl">P</span>
  </div>

  <!-- Área principal do menu (Hero Section) -->
  <div class="hero">
    <!-- Logotipo principal com letras coloridas individuais -->
    <div class="logo-wrap">
      <span class="logo-letter">L</span><span class="logo-letter">E</span><span class="logo-letter">T</span>
      <span class="logo-letter">R</span><span class="logo-letter">I</span><span class="logo-letter">X</span>
      <span class="logo-star">⭐</span>
    </div>

    <!-- Slogan educativo do jogo -->
    <p class="tagline">Aprenda palavras brincando!</p>

    <!-- Card de exibição do Mascote (Leão gerado por IA para visual premium) -->
    <div class="game-preview">
      <img src="assets/lion_mascot.png" alt="Mascote Letrix" class="mascot-img-large">
    </div>

    <!-- Seção de Ações e Modos de Jogo -->
    <div class="cta-area">
      <!-- Grade contendo os 3 modos de jogo disponíveis -->
      <div class="game-modes">
        <!-- Botão para iniciar o jogo Letrix Palavras (Spelling) -->
        <button class="btn-play" onclick="window.location.href='jogar.html'">
          <span class="btn-icon">🔤</span> Letrix Palavras
        </button>
        
        <!-- Botão para iniciar o jogo Letrix Arrastar (Coordenação Motora) -->
        <button class="btn-play mode-drag" onclick="window.location.href='drag.html'">
          <span class="btn-icon">🎯</span> Letrix Arrastar
        </button>

        <!-- Botão para iniciar o jogo Letrix Memória (Associação e Memória) -->
        <button class="btn-play mode-memoria" onclick="window.location.href='memoria.html'">
          <span class="btn-icon">🧠</span> Letrix Memória
        </button>
      </div>

      <!-- Fileira de botões secundários utilitários e de controle -->
      <div class="secondary-btns">
        <!-- Botão de acesso ao Painel Pedagógico de métricas educacionais (Dashboard) -->
        <button class="btn-dashboard" onclick="window.location.href='dashboard.html'">
          📊 Painel Pedagógico
        </button>

        <!-- Botão de Login rápido que leva direto ao campo de login do dashboard -->
        <button class="btn-login" onclick="window.location.href='dashboard.html#login'" title="Login (nome)">
          🔐 Login
        </button>

        <!-- Botão para registrar novo usuário (abre modal) -->
        <button class="btn-register" id="open-register-btn" title="Registrar criança">
          ✍️ Registrar
        </button>

        <!-- Botão do Portfólio da Psicóloga -->
        <button class="btn-portfolio" onclick="window.location.href='portfolio.html'" title="Portfólio da Psicóloga">
          🧠 Portfólio
        </button>
        
        <!-- Botão para exibir a tela de Créditos dos desenvolvedores e instituição -->
        <button class="btn-creditos" onclick="window.location.href='creditos.html'">
          ℹ️ Créditos
        </button>

        <!-- Botão de som global para Ligar/Desligar a música de fundo -->
        <button class="btn-som" id="btn-som" onclick="toggleMusica()">
          🔇
        </button>
      </div>
    </div>
  </div>

  <!-- Inclusão do Gerenciador de Áudio Persistente -->
  <script src="js/audio.js"></script>
  <script src="js/db.js"></script>

  <!-- Registro de Service Worker para habilitar recursos de PWA e Cache offline -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('PWA Service Worker registrado no escopo:', reg.scope))
          .catch((err) => console.error('Falha ao registrar Service Worker do PWA:', err));
      });
    }
  </script>

  <!-- Registration Modal -->
  <div id="register-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; border-radius:12px; width:360px; max-width:92%; padding:18px; box-shadow:0 10px 40px rgba(0,0,0,0.25);">
      <h3 style="margin:0 0 8px 0; font-family: 'Fredoka One', cursive; color:#6c5ce7;">Registrar nova criança</h3>
      <p style="margin:0 0 12px 0; color:#636e72; font-size:13px;">Preencha os dados abaixo (sem senha).</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <input id="reg-name" placeholder="Nome da criança" style="padding:8px;border:1px solid #dfe6e9;border-radius:8px;" />
        <input id="reg-age" type="number" placeholder="Idade" style="padding:8px;border:1px solid #dfe6e9;border-radius:8px;" />
        <input id="reg-school" placeholder="Escolaridade (Ex: 1º ano)" style="padding:8px;border:1px solid #dfe6e9;border-radius:8px;" />
        <select id="reg-handed" style="padding:8px;border:1px solid #dfe6e9;border-radius:8px;">
          <option value="">Destreza (destro/canhoto)</option>
          <option value="Destro">Destro</option>
          <option value="Canhoto">Canhoto</option>
        </select>
        <input id="reg-resp" placeholder="Nome do responsável" style="padding:8px;border:1px solid #dfe6e9;border-radius:8px;" />
        <input id="reg-contact" placeholder="Telefone/Contato" style="padding:8px;border:1px solid #dfe6e9;border-radius:8px;" />
        <input id="reg-email" placeholder="E-mail" style="padding:8px;border:1px solid #dfe6e9;border-radius:8px;" />
      </div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
        <button id="reg-cancel" style="padding:8px 12px; border-radius:8px; border:1px solid #dfe6e9; background:white; cursor:pointer; transition:transform 0.1s;" onmouseover="this.style.background='#f1f2f6'" onmouseout="this.style.background='white'" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'">Cancelar</button>
        <button id="reg-save" style="padding:8px 12px; border-radius:8px; border:1px solid #6c5ce7; background:#6c5ce7; color:white; cursor:pointer; font-weight:bold; transition:transform 0.1s;" onmouseover="this.style.background='#5b4dbd'" onmouseout="this.style.background='#6c5ce7'" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'">Salvar & Entrar</button>
      </div>
    </div>
  </div>

  <script>
    // Registration modal logic
    const openReg = document.getElementById('open-register-btn');
    const regModal = document.getElementById('register-modal');
    const regCancel = document.getElementById('reg-cancel');
    const regSave = document.getElementById('reg-save');

    function openRegister() { regModal.style.display = 'flex'; document.getElementById('reg-name').focus(); }
    function closeRegister() { regModal.style.display = 'none'; }

    if (openReg) openReg.addEventListener('click', (e) => { e.preventDefault(); openRegister(); });
    if (regCancel) regCancel.addEventListener('click', (e) => { e.preventDefault(); closeRegister(); });

    function getUsers() {
      try { return JSON.parse(localStorage.getItem('letrix_users') || '[]'); } catch (e) { return []; }
    }

    function saveUsers(list) { try { localStorage.setItem('letrix_users', JSON.stringify(list)); } catch (e) {} }

    regSave.addEventListener('click', () => {
      const name = document.getElementById('reg-name').value.trim();
      const age = document.getElementById('reg-age').value.trim();
      const school = document.getElementById('reg-school').value.trim();
      const handed = document.getElementById('reg-handed').value;
      const resp = document.getElementById('reg-resp').value.trim();
      const contact = document.getElementById('reg-contact').value.trim();
      const email = document.getElementById('reg-email').value.trim();

      if (!name) { alert('Por favor, informe o nome da criança.'); document.getElementById('reg-name').focus(); return; }

      const users = getUsers();
      // Basic uniqueness by name+age to avoid duplicates
      const exists = users.find(u => u.name === name && u.age == age);
      if (exists) { if (!confirm('Usuário já existe. Deseja registrar de qualquer forma?')) return; }

      const user = { name, age: age || null, escolaridade: school || null, handedness: handed || null, responsavel: resp || null, contact: contact || null, email: email || null, created: new Date().getTime() };
      users.push(user);
      saveUsers(users);
      // Try to persist profile in IndexedDB (if available) before navigating
      if (typeof salvarUsuario === 'function') {
        salvarUsuario(user).then(id => {
          try { localStorage.setItem('letrix_user', name); } catch (e) {}
          closeRegister();
          window.location.href = 'dashboard.html#login';
        }).catch(err => {
          console.error('Erro ao salvar usuario no IndexedDB:', err);
          try { localStorage.setItem('letrix_user', name); } catch (e) {}
          closeRegister();
          window.location.href = 'dashboard.html#login';
        });
      } else {
        try { localStorage.setItem('letrix_user', name); } catch (e) {}
        closeRegister();
        window.location.href = 'dashboard.html#login';
      }
    });

    // If page loaded with #register, open modal
    if (location.hash === '#register') {
      setTimeout(() => openRegister(), 80);
    }
  </script>
</body>
</html>
