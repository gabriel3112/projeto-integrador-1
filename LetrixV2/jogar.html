<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Metadados de codificação e responsividade -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letrix – Jogar</title>
  
  <!-- Fontes importadas para o visual lúdico infantil -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- CSS específico da jogabilidade Letrix Palavras -->
  <link rel="stylesheet" href="css/jogar.css">
</head>
<body>

  <!-- Bolhas flutuantes decorativas em segundo plano -->
  <div class="bg-bubbles">
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
  </div>

  <!-- Contêiner de confete ativado sob vitória de palavra -->
  <div class="confetti-wrap" id="confetti-wrap"></div>

  <!-- Cabeçalho do Jogo -->
  <div class="header">
    <!-- Botão de retorno ao menu principal com micro-animação elástica -->
    <button class="btn-back" onclick="window.location.href='index.html'">←</button>
    
    <!-- Mini logotipo do jogo -->
    <div class="logo-mini">
      <span>L</span><span>E</span><span>T</span><span>R</span><span>I</span><span>X</span>
    </div>
    
    <!-- Exibição gráfica das vidas restantes (corações vermelhos) -->
    <div class="lives" id="lives-display"></div>
  </div>

  <!-- Barra de Progresso de palavras do desafio -->
  <div class="progress-area">
    <div class="progress-info">
      <!-- Exibe "Palavra X de Y" -->
      <span id="progress-text">Palavra 1</span>
      <!-- Porcentagem de conclusão da lista -->
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <!-- Div que expande horizontalmente à medida que acerta -->
      <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
    </div>
  </div>

  <!-- Faixa de Informações da partida -->
  <div class="score-strip">
    <!-- Marcador de palavras seguidas (streak) com ícone de fogo -->
    <div class="score-pill score-streak"><span class="icon">🔥</span><span id="streak-val">0</span> seguidas</div>
    <!-- Temporizador com contagem regressiva por palavra -->
    <div class="score-pill score-timer"><span class="icon">⏱</span><span id="timer-val">30</span>s</div>
  </div>

  <!-- Área de Interação do Jogo -->
  <div class="game-area">
    <!-- Card central contendo a representação visual (pictograma/emoji) -->
    <div class="image-card">
      <div class="image-frame" id="image-frame">
        <!-- Emoji que ilustra o conceito da palavra -->
        <span id="word-emoji" style="line-height:1; font-size:80px;">🦁</span>
        <!-- Botão para pedir ajuda/revelar a próxima letra correta (Dica) -->
        <button class="hint-btn" id="hint-btn" title="Dica">💡</button>
      </div>
      <!-- Categoria da palavra atual (Ex: Animais) -->
      <span class="category-badge" id="category-badge">Animais</span>
    </div>

    <!-- Slots vazios que serão preenchidos pelas letras para formar a palavra -->
    <div class="word-slots" id="word-slots"></div>
    
    <!-- Grade com as letras embaralhadas e distratores que a criança irá clicar -->
    <div class="letter-grid" id="letter-grid"></div>

    <!-- Botões de controle de ação da resposta -->
    <div class="action-row">
      <!-- Botão para limpar todas as letras inseridas nos slots -->
      <button class="btn-clear" id="btn-clear">🔄 Apagar</button>
      <!-- Botão para validar se a palavra digitada está correta (habilitado ao preencher todos os slots) -->
      <button class="btn-confirm" id="btn-confirm" disabled>✓ Confirmar</button>
    </div>
  </div>

  <!-- Overlay modal de feedback (Venceu/Errou/Zerou) -->
  <div class="overlay" id="overlay">
    <div class="overlay-card" id="overlay-card">
      <!-- Emoji que ilustra o resultado (Ex: 🎉 ou 😢) -->
      <div class="overlay-emoji" id="ov-emoji">🎉</div>
      <!-- Título de feedback principal -->
      <div class="overlay-title" id="ov-title">Arrasou!</div>
      <!-- Subtítulo com detalhes (Ex: a grafia correta) -->
      <div class="overlay-sub" id="ov-sub">A palavra era LEÃO</div>
      <!-- Botão para prosseguir no fluxo do jogo -->
      <button class="btn-next" id="btn-next">Próxima ➜</button>
    </div>
  </div>

  <!-- Botão flutuante de mute/unmute do áudio no canto inferior direito -->
  <button class="btn-som" id="btn-som" onclick="toggleMusica()">🔇</button>

  <!-- Dependências JavaScript do jogo -->
  <script src="js/audio.js"></script>          <!-- Gerencia áudio persistente -->
  <script src="js/dashboard.js"></script>      <!-- Registra métricas pedagógicas -->
  <script src="js/db.js"></script>             <!-- Banco de dados IndexedDB -->
  <script src="js/palavras.js"></script>       <!-- Banco de dados de palavras -->
  <script src="js/game-palavras.js"></script>  <!-- Lógica da mecânica de spelling -->
</body>
</html>
