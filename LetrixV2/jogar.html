<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letrix – Jogar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="jogar.css">
</head>
<body>

  <div class="bg-bubbles">
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
  </div>

  <div class="confetti-wrap" id="confetti-wrap"></div>

  <div class="header">
    <button class="btn-back" onclick="window.location.href='index.html'">←</button>
    <div class="logo-mini">
      <span>L</span><span>E</span><span>T</span><span>R</span><span>I</span><span>X</span>
    </div>
    <div class="lives" id="lives-display"></div>
  </div>

  <div class="progress-area">
    <div class="progress-info">
      <span id="progress-text">Palavra 1</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
    </div>
  </div>

  <div class="score-strip">
    <div class="score-pill score-pts"><span class="icon">⭐</span><span id="score-val">0</span> pts</div>
    <div class="score-pill score-streak"><span class="icon">🔥</span><span id="streak-val">0</span> seguidas</div>
    <div class="score-pill score-timer"><span class="icon">⏱</span><span id="timer-val">30</span>s</div>
  </div>

  <div class="game-area">
    <div class="image-card">
      <div class="image-frame" id="image-frame">
        <span id="word-emoji" style="line-height:1; font-size:80px;">🦁</span>
        <button class="hint-btn" id="hint-btn" title="Dica (-20 pts)">💡</button>
      </div>
      <span class="category-badge" id="category-badge">Animais</span>
    </div>

    <div class="word-slots" id="word-slots"></div>
    <div class="letter-grid" id="letter-grid"></div>

    <div class="action-row">
      <button class="btn-clear" id="btn-clear">🔄 Apagar</button>
      <button class="btn-confirm" id="btn-confirm" disabled>✓ Confirmar</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-card" id="overlay-card">
      <div class="overlay-emoji" id="ov-emoji">🎉</div>
      <div class="overlay-title" id="ov-title">Arrasou!</div>
      <div class="overlay-sub" id="ov-sub">A palavra era LEÃO</div>
      <div class="overlay-pts" id="ov-pts">+100 pts</div>
      <button class="btn-next" id="btn-next">Próxima ➜</button>
    </div>
  </div>

  <script src="palavras.js"></script>
  <script>
    let WORDS = [];
    const COLORS = ['#FF6B6B','#74B9FF','#55EFC4','#A29BFE','#FDCB6E','#FD79A8','#FF8E53','#00b894'];
    const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    let currentIdx = 0, score = 0, streak = 0, lives = 3;
    let timerSec = 30, timerInterval = null;
    let filledSlots = [], usedLetterEls = [], hintUsed = false;

    // Inicia e carrega as palavras do "txt"
    function initWords() {
      const lines = CONTEUDO_TXT.split('\n').filter(l => l.trim() !== '');
      WORDS = lines.map(line => {
        const parts = line.split('|');
        const word = parts[0].trim().toUpperCase();
        return {
          word: word,
          emoji: parts[1] ? parts[1].trim() : '❓',
          badge: parts[2] ? parts[2].trim() : 'Geral',
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          extra: generateExtraLetters(word, 3)
        };
      });
      WORDS = shuffle(WORDS);
      loadWord();
    }

    function generateExtraLetters(word, count) {
      let extras = [];
      while(extras.length < count) {
        const l = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
        if(!word.includes(l) && !extras.includes(l)) extras.push(l);
      }
      return extras;
    }

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    function renderLives() {
      const el = document.getElementById('lives-display');
      el.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const h = document.createElement('span');
        h.className = 'heart' + (i >= lives ? ' lost' : '');
        h.textContent = '❤️';
        el.appendChild(h);
      }
    }

    function updateProgress() {
      const pct = Math.round(((currentIdx) / WORDS.length) * 100);
      document.getElementById('progress-text').textContent = `Palavra ${currentIdx + 1} de ${WORDS.length}`;
      document.getElementById('progress-pct').textContent = pct + '%';
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerSec = 30; hintUsed = false;
      const el = document.getElementById('timer-val');
      el.classList.remove('timer-urgent');
      el.textContent = timerSec;
      timerInterval = setInterval(() => {
        timerSec--; el.textContent = timerSec;
        if (timerSec <= 10) el.classList.add('timer-urgent');
        if (timerSec <= 0) timeUp();
      }, 1000);
    }

    function loadWord() {
      const data = WORDS[currentIdx];
      filledSlots = Array(data.word.length).fill(null);
      usedLetterEls = [];

      document.getElementById('word-emoji').textContent = data.emoji;
      document.getElementById('image-frame').style.background = data.color + '22';
      const badge = document.getElementById('category-badge');
      badge.textContent = data.badge;
      badge.style.background = data.color + '22';
      badge.style.color = data.color;
      badge.style.border = '2px solid ' + data.color + '66';

      const slotsEl = document.getElementById('word-slots');
      slotsEl.innerHTML = '';
      for (let i = 0; i < data.word.length; i++) {
        const s = document.createElement('div');
        s.className = 'slot';
        s.addEventListener('click', () => removeFromSlot(i));
        slotsEl.appendChild(s);
      }

      const letters = shuffle([...data.word.split(''), ...data.extra]);
      const grid = document.getElementById('letter-grid');
      grid.innerHTML = '';
      letters.forEach((letter, i) => {
        const btn = document.createElement('div');
        btn.className = 'lc'; btn.textContent = letter;
        const color = COLORS[i % COLORS.length];
        btn.style.background = color + '18';
        btn.style.borderColor = color;
        btn.style.color = color;
        btn.dataset.letter = letter;
        btn.addEventListener('click', () => pickLetter(btn));
        grid.appendChild(btn);
      });

      document.getElementById('btn-confirm').disabled = true;
      startTimer(); updateProgress(); renderLives();
    }

    function pickLetter(btn) {
      if (btn.classList.contains('used')) return;
      const nextEmpty = filledSlots.findIndex(v => v === null);
      if (nextEmpty === -1) return;

      filledSlots[nextEmpty] = { letter: btn.dataset.letter, el: btn };
      btn.classList.add('used');

      const slotEls = document.getElementById('word-slots').children;
      const slotEl = slotEls[nextEmpty];
      slotEl.textContent = btn.dataset.letter;
      slotEl.className = 'slot filled';
      slotEl.style.background = btn.style.background;
      slotEl.style.borderColor = btn.style.borderColor;
      slotEl.style.color = btn.style.color;

      document.getElementById('btn-confirm').disabled = filledSlots.includes(null);
    }

    function removeFromSlot(idx) {
      if (!filledSlots[idx]) return;
      filledSlots[idx].el.classList.remove('used');
      filledSlots[idx] = null;

      const slotEl = document.getElementById('word-slots').children[idx];
      slotEl.textContent = '';
      slotEl.className = 'slot';
      slotEl.style.background = 'white';
      slotEl.style.borderColor = '#d0d0d0';
      document.getElementById('btn-confirm').disabled = true;
    }

    document.getElementById('btn-clear').addEventListener('click', () => {
      filledSlots.forEach((_, i) => removeFromSlot(i));
    });

    document.getElementById('hint-btn').addEventListener('click', () => {
      if (hintUsed) return;
      hintUsed = true;
      score = Math.max(0, score - 20);
      document.getElementById('score-val').textContent = score;
      
      const currentWord = WORDS[currentIdx].word;
      const nextEmpty = filledSlots.findIndex(v => v === null);
      if (nextEmpty !== -1) {
        const correctLetter = currentWord[nextEmpty];
        const btns = Array.from(document.getElementById('letter-grid').children);
        const correctBtn = btns.find(b => b.dataset.letter === correctLetter && !b.classList.contains('used'));
        if(correctBtn) pickLetter(correctBtn);
      }
    });

    document.getElementById('btn-confirm').addEventListener('click', () => {
      const currentWord = WORDS[currentIdx].word;
      const userWord = filledSlots.map(s => s.letter).join('');

      if (userWord === currentWord) {
        clearInterval(timerInterval);
        const earned = 100 + (timerSec * 2);
        score += earned; streak++;
        document.getElementById('score-val').textContent = score;
        document.getElementById('streak-val').textContent = streak;

        showOverlay(WORDS[currentIdx].emoji, "Arrasou!", "A palavra era " + currentWord, "+" + earned + " pts", true);
        launchConfetti();
      } else {
        streak = 0; document.getElementById('streak-val').textContent = streak;
        lives--; renderLives();
        const slots = document.getElementById('word-slots').children;
        Array.from(slots).forEach(el => {
          el.classList.add('wrong');
          setTimeout(() => el.classList.remove('wrong'), 400);
        });
        if (lives <= 0) gameOver();
      }
    });

    function timeUp() {
      lives--; renderLives();
      if (lives <= 0) gameOver();
      else { alert("Tempo esgotado! Uma vida perdida."); startTimer(); }
    }

    function gameOver() {
      clearInterval(timerInterval);
      showOverlay("😢", "Fim de Jogo!", "Você ficou sem vidas.", "Pontos: " + score, false);
    }

    function showOverlay(emoji, title, sub, ptsText, isWin) {
      document.getElementById('ov-emoji').textContent = emoji;
      document.getElementById('ov-title').textContent = title;
      document.getElementById('ov-sub').textContent = sub;
      
      const ptsEl = document.getElementById('ov-pts');
      ptsEl.textContent = ptsText;
      ptsEl.className = 'overlay-pts ' + (isWin ? 'ok' : 'fail');
      
      const btn = document.getElementById('btn-next');
      btn.className = 'btn-next ' + (isWin ? 'ok' : 'fail');
      
      if(!isWin) {
        btn.textContent = '🔄 Jogar de novo';
        btn.onclick = () => window.location.href = 'index.html';
      } else {
        btn.textContent = 'Próxima ➜';
        btn.onclick = () => {
          document.getElementById('overlay').classList.remove('show');
          currentIdx++;
          if (currentIdx >= WORDS.length) {
            showOverlay("🏆", "Zerou!", "Você completou todas as palavras!", "Total: " + score, false);
          } else loadWord();
        };
      }
      document.getElementById('overlay').classList.add('show');
    }

    function launchConfetti() {
      const wrap = document.getElementById('confetti-wrap');
      wrap.innerHTML = '';
      for (let i = 0; i < 40; i++) {
        const c = document.createElement('div');
        c.className = 'conf';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
        c.style.width = (6 + Math.random() * 8) + 'px';
        c.style.height = (10 + Math.random() * 10) + 'px';
        c.style.animationDelay = (Math.random() * 0.5) + 's';
        wrap.appendChild(c);
      }
    }

    initWords();
  </script>
</body>
</html>
