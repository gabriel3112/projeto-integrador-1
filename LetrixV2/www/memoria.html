<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Metadados de codificação e viewport responsivo -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letrix – Jogo de Memória</title>
  
  <!-- Importação de fontes lúdicas do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- CSS de animação de cartas e grid do jogo de memória -->
  <link rel="stylesheet" href="css/memoria.css">
</head>
<body>

  <!-- Bolhas flutuantes no plano de fundo -->
  <div class="bg-bubbles">
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
  </div>

  <!-- Efeito de confetes coloridos ativado sob vitória -->
  <div class="confetti-wrap" id="confetti-wrap"></div>

  <!-- Cabeçalho (Header) -->
  <div class="header">
    <!-- Botão com elástico em hover para retornar ao index -->
    <button class="btn-back" onclick="window.location.href='index.html'">←</button>
    <div class="logo-mini">
      <span>L</span><span>E</span><span>T</span><span>R</span><span>I</span><span>X</span>
    </div>
    <!-- Exibição de corações de vida (perde 1 vida a cada 3 pares incorretos) -->
    <div class="lives" id="lives-display"></div>
  </div>

  <!-- Área de Progresso Lexical -->
  <div class="progress-area">
    <div class="progress-info">
      <!-- Exibe "Pares Encontrados: X de 6" -->
      <span id="progress-text">Pares Encontrados: 0 de 6</span>
      <!-- Porcentagem de conclusão da partida -->
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
    </div>
  </div>

  <!-- Faixa de Informações da partida (sem pontos) -->
  <div class="score-strip">
    <!-- Contador de movimentos/jogadas totais na rodada -->
    <div class="score-pill score-streak"><span class="icon">🔄</span><span id="moves-val">0</span> jogadas</div>
    <!-- Temporizador com contagem decrescente -->
    <div class="score-pill score-timer"><span class="icon">⏱</span><span id="timer-val">60</span>s</div>
  </div>

  <!-- Área do Jogo -->
  <div class="game-area">
    <!-- Instrução com objetivo pedagógico -->
    <p class="instruction">
      Combine a <strong>imagem 🐯</strong> com a sua <strong>palavra GATO</strong> escrita!
    </p>

    <!-- Grade que receberá as 12 cartas dinamicamente do JavaScript (6 pares) -->
    <div class="card-grid" id="card-grid"></div>
  </div>

  <!-- Overlay Modal de Conclusão / Game Over -->
  <div class="overlay" id="overlay">
    <div class="overlay-card" id="overlay-card">
      <div class="overlay-emoji" id="ov-emoji">🎉</div>
      <div class="overlay-title" id="ov-title">Arrasou!</div>
      <div class="overlay-sub" id="ov-sub">Excelente memória!</div>
      <!-- Exibe estatísticas de status (Ex: total de "Jogadas: X") -->
      <div class="overlay-status" id="ov-status"></div>
      <!-- Botão para prosseguir ou recomeçar -->
      <button class="btn-next" id="btn-next">Próxima ➜</button>
    </div>
  </div>

  <!-- Controle de volume / botão mute flutuante -->
  <button class="btn-som" id="btn-som" onclick="toggleMusica()">🔇</button>

  <!-- Dependências JavaScript -->
  <script src="js/audio.js"></script>          <!-- Áudio global persistente -->
  <script src="js/dashboard.js"></script>      <!-- Registro de métricas de movimentos e vitórias -->
  <script src="js/db.js"></script>             <!-- Banco de dados IndexedDB -->
  <script src="js/palavras.js"></script>       <!-- Base de dados de palavras -->
  <script src="js/game-memoria.js"></script>   <!-- Mecânica de embaralhamento, viradas e matching de cartas -->
</body>
</html>
