<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Metadados de codificação e responsividade para dispositivos móveis -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Letrix – Jogo de Coordenação</title>
  
  <!-- Fontes lúdicas -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  
  <!-- CSS específico da mecânica de arrasto do labirinto -->
  <link rel="stylesheet" href="css/drag.css" />
</head>
<body>

  <!-- Bolhas flutuantes no fundo (visual decorativo) -->
  <div class="bg-bubbles">
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
  </div>

  <!-- Contêiner de confete ativado na vitória -->
  <div class="conf-wrap" id="conf-wrap"></div>

  <!-- Cabeçalho (Header) -->
  <div class="header">
    <!-- Botão de voltar ao menu com animação bouncy no hover -->
    <button class="btn-back" onclick="window.location.href='index.html'">←</button>
    <div class="logo-mini">
      <span>L</span><span>E</span><span>T</span><span>R</span><span>I</span><span>X</span>
    </div>
    <!-- Espaçador invisível para centralização do título -->
    <div style="width:40px"></div>
  </div>

  <!-- Faixa de Informações do Jogo -->
  <div class="info-strip">
    <!-- Marcador de vidas restantes -->
    <div class="pill lives"><span class="icon">❤️</span> <span id="lives-val">3</span> vidas</div>
    <!-- Nível de dificuldade atual correspondente ao caminho selecionado -->
    <div class="pill level"><span class="icon">⭐</span> Nível <span id="level-val">1</span></div>
    <!-- Cronômetro de tempo restante no labirinto -->
    <div class="pill timer"><span class="icon">⏱</span> <span id="timer-val">60</span>s</div>
  </div>

  <!-- Seleção Rápida de Dificuldade (Chips interativos) -->
  <div class="level-row">
    <div class="lv-chip easy active"   data-lv="0">⭐ Fácil</div>
    <div class="lv-chip medium"        data-lv="1">⭐⭐ Médio</div>
    <div class="lv-chip hard"          data-lv="2">⭐⭐⭐ Difícil</div>
  </div>

  <!-- Instrução do jogo para orientação da criança -->
  <p class="instruction">
    Arraste o <strong>🚀 foguete</strong> pelo caminho até a <strong>⭐ estrela</strong>!<br>
    Não encoste nas paredes roxas!
  </p>

  <!-- Arena onde ocorre a renderização física do jogo -->
  <div class="arena-wrap">
    <div id="arena">
      <!-- O caminho de arrasto e as zonas (Início e Fim) são renderizadas dinamicamente dentro deste SVG -->
      <svg id="path-svg" viewBox="0 0 488 360" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <!-- Overlay Modal de Conclusão / Game Over -->
  <div class="overlay" id="overlay">
    <div class="ov-card">
      <div class="ov-emoji" id="ov-emoji">🎉</div>
      <div class="ov-title" id="ov-title">Arrasou!</div>
      <div class="ov-sub"   id="ov-sub">Você chegou ao fim do caminho!</div>
      <!-- Exibe um badge de status (Ex: "Fase Concluída!" ou "Fim de jogo") -->
      <div class="ov-status" id="ov-status"></div>
      <!-- Botão para reiniciar o nível ou seguir para o próximo de forma progressiva -->
      <button class="btn-restart ok" id="btn-restart">🔄 Jogar de novo</button>
    </div>
  </div>

  <!-- Botão de mute/unmute do som de fundo -->
  <button class="btn-som" id="btn-som" onclick="toggleMusica()">🔇</button>

  <!-- Dependências JavaScript -->
  <script src="js/audio.js"></script>      <!-- Controle de som persistente -->
  <script src="js/dashboard.js"></script>  <!-- Métricas de colisão e tempo para o dashboard -->
  <script src="js/db.js"></script>         <!-- Banco de dados IndexedDB -->
  <script src="js/game-drag.js"></script>   <!-- Lógica física de colisão e arrasto do labirinto -->
</body>
</html>
