<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Letrix – Jogo de Coordenação</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    /* ===========================
       RESET & BASE
    =========================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FFF9EC;
      --path-bg:   #E8F4FD;
      --path-brd:  #74B9FF;
      --wall:      #A29BFE;
      --wall-dark: #6c5ce7;
      --green:     #00b894;
      --red:       #FF6B6B;
      --yellow:    #FDCB6E;
      --text:      #2d3436;
      --sub:       #636e72;
      --shadow:    rgba(0,0,0,0.10);
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      touch-action: none; /* evita scroll durante arrasto */
    }

    /* ===========================
       BUBBLES DE FUNDO
    =========================== */
    .bg-bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bubble { position: absolute; border-radius: 50%; opacity: 0.09; animation: fbubble 6s ease-in-out infinite; }
    @keyframes fbubble { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-14px) scale(1.04);} }
    .bubble:nth-child(1){width:130px;height:130px;background:#FF6B6B;top:2%;left:1%;animation-delay:0s;}
    .bubble:nth-child(2){width:90px;height:90px;background:#A29BFE;top:8%;right:3%;animation-delay:1.4s;}
    .bubble:nth-child(3){width:60px;height:60px;background:#55EFC4;bottom:10%;left:4%;animation-delay:2.6s;}
    .bubble:nth-child(4){width:100px;height:100px;background:#FDCB6E;bottom:4%;right:5%;animation-delay:0.8s;}

    /* ===========================
       HEADER
    =========================== */
    .header {
      position: relative; z-index: 10;
      width: 100%; max-width: 520px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 8px;
    }
    .btn-back {
      width: 40px; height: 40px; border-radius: 13px;
      background: white; border: 2.5px solid #e0e0e0;
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s;
    }
    .btn-back:hover { transform: scale(1.08); }

    .logo-mini { font-family: 'Fredoka One', cursive; font-size: 24px; }
    .logo-mini span:nth-child(1){color:#FF6B6B;}
    .logo-mini span:nth-child(2){color:#FF8E53;}
    .logo-mini span:nth-child(3){color:#FFE66D;}
    .logo-mini span:nth-child(4){color:#55EFC4;}
    .logo-mini span:nth-child(5){color:#4ECDC4;}
    .logo-mini span:nth-child(6){color:#A29BFE;}

    /* ===========================
       INFO STRIP
    =========================== */
    .info-strip {
      position: relative; z-index: 10;
      width: 100%; max-width: 520px;
      display: flex; justify-content: center; gap: 12px;
      padding: 6px 20px 10px;
    }
    .pill {
      background: white; border-radius: 30px;
      padding: 6px 16px;
      font-size: 13px; font-weight: 800;
      box-shadow: 0 3px 12px var(--shadow);
      display: flex; align-items: center; gap: 6px;
    }
    .pill .icon { font-size: 16px; }
    .pill.lives { color: #e84393; }
    .pill.level { color: #6c5ce7; }
    .pill.timer { color: var(--green); }

    /* ===========================
       INSTRUÇÃO
    =========================== */
    .instruction {
      position: relative; z-index: 10;
      font-size: 14px; font-weight: 700; color: var(--sub);
      text-align: center; margin-bottom: 8px;
      padding: 0 20px;
    }
    .instruction strong { color: var(--text); }

    /* ===========================
       ARENA (canvas do jogo)
    =========================== */
    .arena-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 520px;
      padding: 0 16px;
      display: flex; flex-direction: column; align-items: center;
    }

    /* container do labirinto */
    #arena {
      position: relative;
      width: 100%;
      max-width: 488px;
      background: white;
      border-radius: 28px;
      box-shadow: 0 8px 36px var(--shadow);
      overflow: hidden;
      touch-action: none;
      cursor: none; /* esconde cursor padrão durante drag */
    }

    /* SVG do caminho */
    #path-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Zona de início e fim */
    .zone {
      position: absolute;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      font-family: 'Fredoka One', cursive;
      pointer-events: none;
      z-index: 2;
      transition: transform .3s;
    }
    .zone-start {
      width: 54px; height: 54px;
      background: var(--green);
      box-shadow: 0 0 0 6px #D5F5E355, 0 4px 18px rgba(0,184,148,.4);
      color: white; font-size: 24px;
    }
    .zone-end {
      width: 54px; height: 54px;
      background: var(--yellow);
      box-shadow: 0 0 0 6px #FFEAA755, 0 4px 18px rgba(253,203,110,.5);
      color: white; font-size: 24px;
    }

    /* O objeto arrastável */
    #draggable {
      position: absolute;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      box-shadow: 0 4px 16px rgba(255,107,107,.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      cursor: grab;
      z-index: 10;
      touch-action: none;
      transition: box-shadow .2s;
      user-select: none;
    }
    #draggable.dragging { cursor: grabbing; transform: scale(1.15); }
    #draggable.error {
      animation: shake-err .4s ease;
      background: var(--red) !important;
      box-shadow: 0 0 0 8px rgba(255,107,107,.3), 0 4px 20px rgba(255,107,107,.6);
    }
    #draggable.win {
      animation: spin-win .5s ease;
      background: linear-gradient(135deg, var(--green), #55EFC4) !important;
      box-shadow: 0 0 0 10px rgba(0,184,148,.3);
    }
    @keyframes shake-err {
      0%,100%{transform:translateX(0);}
      20%{transform:translateX(-8px);}
      40%{transform:translateX(8px);}
      60%{transform:translateX(-6px);}
      80%{transform:translateX(6px);}
    }
    @keyframes spin-win {
      from{transform:scale(1) rotate(0deg);}
      50%{transform:scale(1.4) rotate(180deg);}
      to{transform:scale(1) rotate(360deg);}
    }

    /* Paredes decorativas (bordas do caminho) */
    .wall-label {
      position: absolute;
      font-size: 10px; font-weight: 800;
      color: white; background: var(--wall);
      border-radius: 30px; padding: 2px 8px;
      pointer-events: none; z-index: 3;
      letter-spacing: 0.5px;
    }

    /* ===========================
       OVERLAY (vitória / derrota)
    =========================== */
    .overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.42);
    }
    .overlay.show { display: flex; }

    .ov-card {
      background: white; border-radius: 32px;
      padding: 32px 28px; width: 86%; max-width: 320px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      animation: pop-card .4s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes pop-card {
      from{transform:scale(.6);opacity:0;}
      to{transform:scale(1);opacity:1;}
    }
    .ov-emoji  { font-size: 72px; line-height: 1; }
    .ov-title  { font-family: 'Fredoka One', cursive; font-size: 30px; text-align: center; }
    .ov-sub    { font-size: 14px; font-weight: 700; color: var(--sub); text-align: center; line-height: 1.5; }
    .ov-pts    { font-family: 'Fredoka One', cursive; font-size: 20px; padding: 7px 22px; border-radius: 30px; }
    .ov-pts.ok   { background: #D5F5E3; color: var(--green); }
    .ov-pts.fail { background: #FDECEA; color: var(--red); }

    .btn-restart {
      width: 100%; padding: 15px;
      border-radius: 18px; border: none;
      font-family: 'Fredoka One', cursive; font-size: 20px;
      color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform .15s;
    }
    .btn-restart:hover { transform: scale(1.03); }
    .btn-restart.ok   { background: linear-gradient(135deg,#55EFC4,var(--green)); box-shadow: 0 5px 20px rgba(0,184,148,.35); }
    .btn-restart.fail { background: linear-gradient(135deg,var(--red),#FF8E53);   box-shadow: 0 5px 20px rgba(255,107,107,.35); }

    /* ===========================
       CONFETTI
    =========================== */
    .conf-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 200; display: none; }
    .conf-wrap.show { display: block; }
    .conf {
      position: absolute; width: 10px; height: 10px; border-radius: 2px;
      opacity: 0; animation: conf-fall 1.3s ease forwards;
    }
    @keyframes conf-fall {
      0%  { opacity: 1; transform: translateY(-10px) rotate(0deg); }
      100%{ opacity: 0; transform: translateY(500px) rotate(720deg); }
    }

    /* ===========================
       LEVEL SELECT CHIPS
    =========================== */
    .level-row {
      position: relative; z-index: 10;
      display: flex; gap: 8px; justify-content: center;
      padding: 0 20px 12px;
    }
    .lv-chip {
      padding: 7px 18px; border-radius: 30px;
      font-size: 12px; font-weight: 800;
      cursor: pointer; border: 2px solid transparent;
      transition: all .2s; user-select: none;
    }
    .lv-chip.easy   { background: #D5F5E3; color: var(--green); border-color: #A9DFBF; }
    .lv-chip.medium { background: #FFEAA7; color: #e17055;      border-color: #FDCB6E; }
    .lv-chip.hard   { background: #FFD6E0; color: #e84393;      border-color: #FABCD1; }
    .lv-chip.active { box-shadow: 0 3px 12px rgba(0,0,0,.15); transform: scale(1.06); }
    .lv-chip.easy.active   { background: var(--green); color: white; border-color: var(--green); }
    .lv-chip.medium.active { background: #e17055; color: white; border-color: #e17055; }
    .lv-chip.hard.active   { background: #e84393; color: white; border-color: #e84393; }
  </style>
</head>
<body>

  <!-- fundo decorativo -->
  <div class="bg-bubbles">
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
  </div>

  <!-- confetti -->
  <div class="conf-wrap" id="conf-wrap"></div>

  <!-- HEADER -->
    <div class="header" style="position: relative; z-index: 999; pointer-events: auto;">
    <button class="btn-back" onclick="window.location.href='index.html'">←</button>
    <div class="logo-mini">
      <span>L</span><span>E</span><span>T</span><span>R</span><span>I</span><span>X</span>
    </div>
    <div style="width:40px"></div>
  </div>

  <!-- INFO -->
  <div class="info-strip">
    <div class="pill lives"><span class="icon">❤️</span> <span id="lives-val">3</span> vidas</div>
    <div class="pill level"><span class="icon">⭐</span> Nível <span id="level-val">1</span></div>
    <div class="pill timer"><span class="icon">⏱</span> <span id="timer-val">60</span>s</div>
  </div>

  <!-- NÍVEL -->
  <div class="level-row">
    <div class="lv-chip easy active"   data-lv="0">⭐ Fácil</div>
    <div class="lv-chip medium"        data-lv="1">⭐⭐ Médio</div>
    <div class="lv-chip hard"          data-lv="2">⭐⭐⭐ Difícil</div>
  </div>

  <!-- INSTRUÇÃO -->
  <p class="instruction">
    Arraste o <strong>🚀 foguete</strong> pelo caminho até a <strong>⭐ estrela</strong>!<br>
    Não encoste nas paredes roxas!
  </p>

  <!-- ARENA -->
  <div class="arena-wrap">
    <div id="arena">
      <!-- SVG do caminho é inserido pelo JS -->
      <svg id="path-svg" viewBox="0 0 488 360" xmlns="http://www.w3.org/2000/svg"></svg>
      <!-- Zonas e objeto inseridos pelo JS -->
    </div>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay">
    <div class="ov-card">
      <div class="ov-emoji" id="ov-emoji">🎉</div>
      <div class="ov-title" id="ov-title">Arrasou!</div>
      <div class="ov-sub"   id="ov-sub">Você chegou ao fim do caminho!</div>
      <div class="ov-pts"   id="ov-pts">+100 pts</div>
      <button class="btn-restart ok" id="btn-restart">🔄 Jogar de novo</button>
    </div>
  </div>

  <script>
  /*
   * =====================================================
   *  LETRIX – JOGO DE COORDENAÇÃO
   *  Arraste o foguete pelo corredor sem tocar nas paredes.
   * =====================================================
   */

  // --------------------------------------------------
  // CONFIGURAÇÃO DOS NÍVEIS
  // Cada nível define segmentos do caminho em coordenadas
  // do viewBox 488×360. O corredor tem uma largura (gap).
  // --------------------------------------------------
  const LEVELS = [
    {
      // Fácil: caminho reto horizontal
      name: 'Fácil',
      gap: 70,          // largura do corredor em px do viewBox
      timeSec: 60,
      segments: [
        { x1: 40,  y1: 180, x2: 448, y2: 180 }  // linha reta
      ],
      // waypoints que o caminho percorre (poligonal)
      points: [
        {x:40,  y:180},
        {x:448, y:180}
      ]
    },
    {
      // Médio: caminho em L
      name: 'Médio',
      gap: 55,
      timeSec: 50,
      points: [
        {x:44,  y:290},
        {x:44,  y:90},
        {x:444, y:90},
        {x:444, y:270}
      ]
    },
    {
      // Difícil: ziguezague
      name: 'Difícil',
      gap: 44,
      timeSec: 40,
      points: [
        {x:44,  y:300},
        {x:44,  y:90},
        {x:200, y:90},
        {x:200, y:270},
        {x:360, y:270},
        {x:360, y:90},
        {x:444, y:90}
      ]
    }
  ];

  // --------------------------------------------------
  // ESTADO DO JOGO
  // --------------------------------------------------
  let currentLevel = 0;  // índice do nível selecionado
  let lives       = 3;
  let score       = 0;
  let timerSec    = 60;
  let timerHandle = null;
  let isDragging  = false;
  let gameActive  = false;
  let dragOffX    = 0, dragOffY = 0;

  // Referências DOM
  const arena      = document.getElementById('arena');
  const pathSVG    = document.getElementById('path-svg');
  const overlay    = document.getElementById('overlay');
  const livesEl    = document.getElementById('lives-val');
  const levelEl    = document.getElementById('level-val');
  const timerEl    = document.getElementById('timer-val');
  const ovEmoji    = document.getElementById('ov-emoji');
  const ovTitle    = document.getElementById('ov-title');
  const ovSub      = document.getElementById('ov-sub');
  const ovPts      = document.getElementById('ov-pts');
  const btnRestart = document.getElementById('btn-restart');

  // --------------------------------------------------
  // CONSTRUÇÃO DO CAMINHO SVG
  // Gera o polígono de corredor dado os waypoints e gap.
  // --------------------------------------------------
  function buildPath(points, gap) {
    const svgNS = 'http://www.w3.org/2000/svg';
    pathSVG.innerHTML = ''; // limpa

    // Fundo geral (parede)
    const bg = document.createElementNS(svgNS, 'rect');
    bg.setAttribute('x', 0); bg.setAttribute('y', 0);
    bg.setAttribute('width', 488); bg.setAttribute('height', 360);
    bg.setAttribute('fill', '#EDE7F6');
    pathSVG.appendChild(bg);

    // Constrói o corredor: desenha cada segmento com rect rotacionado
    for (let i = 0; i < points.length - 1; i++) {
      const p1 = points[i], p2 = points[i + 1];
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;
      const cx = (p1.x + p2.x) / 2, cy = (p1.y + p2.y) / 2;

      const seg = document.createElementNS(svgNS, 'rect');
      seg.setAttribute('x', cx - len/2);
      seg.setAttribute('y', cy - gap/2);
      seg.setAttribute('width', len);
      seg.setAttribute('height', gap);
      seg.setAttribute('rx', gap/2);
      seg.setAttribute('fill', '#E8F4FD');
      seg.setAttribute('stroke', '#74B9FF');
      seg.setAttribute('stroke-width', '3');
      seg.setAttribute('transform', `rotate(${angle},${cx},${cy})`);
      pathSVG.appendChild(seg);

      // Ponto de junção (círculo) para cobrir cantos
      if (i > 0) {
        const junc = document.createElementNS(svgNS, 'circle');
        junc.setAttribute('cx', p1.x); junc.setAttribute('cy', p1.y);
        junc.setAttribute('r', gap/2 + 1);
        junc.setAttribute('fill', '#E8F4FD');
        junc.setAttribute('stroke', '#74B9FF');
        junc.setAttribute('stroke-width', '3');
        pathSVG.appendChild(junc);
      }
    }

    // Seta decorativa ao longo do caminho
    const arrowPath = points.map((p,i) => (i===0?'M':'L')+p.x+' '+p.y).join(' ');
    const arrow = document.createElementNS(svgNS, 'path');
    arrow.setAttribute('d', arrowPath);
    arrow.setAttribute('fill', 'none');
    arrow.setAttribute('stroke', '#74B9FF');
    arrow.setAttribute('stroke-width', '1.5');
    arrow.setAttribute('stroke-dasharray', '10 8');
    arrow.setAttribute('opacity', '0.5');
    pathSVG.appendChild(arrow);
  }

  // --------------------------------------------------
  // POSICIONAMENTO DAS ZONAS E OBJETO
  // Converte coordenadas do viewBox para pixels do arena
  // --------------------------------------------------
  function vbToPx(vbX, vbY) {
    const rect = arena.getBoundingClientRect();
    const scaleX = rect.width  / 488;
    const scaleY = rect.height / 360;
    return { x: vbX * scaleX, y: vbY * scaleY };
  }

  function placeZones(points) {
    // Remove zonas antigas
    document.querySelectorAll('.zone, #draggable').forEach(e => e.remove());

    const start = points[0];
    const end   = points[points.length - 1];

    // Zona de início
    const zStart = document.createElement('div');
    zStart.className = 'zone zone-start';
    zStart.textContent = '🏁';
    const ps = vbToPx(start.x, start.y);
    zStart.style.left = (ps.x - 27) + 'px';
    zStart.style.top  = (ps.y - 27) + 'px';
    arena.appendChild(zStart);

    // Zona de fim
    const zEnd = document.createElement('div');
    zEnd.className = 'zone zone-end';
    zEnd.id = 'zone-end';
    zEnd.textContent = '⭐';
    const pe = vbToPx(end.x, end.y);
    zEnd.style.left = (pe.x - 27) + 'px';
    zEnd.style.top  = (pe.y - 27) + 'px';
    arena.appendChild(zEnd);

    // Objeto arrastável
    const drag = document.createElement('div');
    drag.id = 'draggable';
    drag.textContent = '🚀';
    drag.style.left = (ps.x - 22) + 'px';
    drag.style.top  = (ps.y - 22) + 'px';
    arena.appendChild(drag);

    // Eventos de arrasto
    drag.addEventListener('mousedown', onDragStart);
    drag.addEventListener('touchstart', onDragStart, { passive: false });
  }

  // --------------------------------------------------
  // COLISÃO: verifica se o centro do objeto está dentro
  // do corredor (a menos de gap/2 de algum segmento)
  // --------------------------------------------------
  function pointToSegmentDist(px, py, ax, ay, bx, by) {
    const abx = bx - ax, aby = by - ay;
    const apx = px - ax, apy = py - ay;
    const t = Math.max(0, Math.min(1, (apx*abx + apy*aby) / (abx*abx + aby*aby)));
    const dx = px - (ax + t*abx);
    const dy = py - (ay + t*aby);
    return Math.sqrt(dx*dx + dy*dy);
  }

  function isInsidePath(cx, cy) {
    // Converte pixel do arena para coordenadas do viewBox
    const rect = arena.getBoundingClientRect();
    const scaleX = 488 / rect.width;
    const scaleY = 360 / rect.height;
    const vx = cx * scaleX;
    const vy = cy * scaleY;

    const lv  = LEVELS[currentLevel];
    const pts = lv.points;
    const halfGap = lv.gap / 2;

    for (let i = 0; i < pts.length - 1; i++) {
      const d = pointToSegmentDist(vx, vy, pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y);
      if (d <= halfGap) return true;
    }
    return false;
  }

  // --------------------------------------------------
  // VERIFICA SE CHEGOU À ZONA FINAL
  // --------------------------------------------------
  function isAtEnd(cx, cy) {
    const lv  = LEVELS[currentLevel];
    const end = lv.points[lv.points.length - 1];
    const pe  = vbToPx(end.x, end.y);
    const dx  = cx - pe.x, dy = cy - pe.y;
    return Math.sqrt(dx*dx + dy*dy) < 30;
  }

  // --------------------------------------------------
  // INÍCIO DO ARRASTO
  // --------------------------------------------------
  function onDragStart(e) {
    if (!gameActive) return;
    e.preventDefault();

    isDragging = true;
    const drag = document.getElementById('draggable');
    drag.classList.add('dragging');

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const rect = drag.getBoundingClientRect();
    dragOffX = clientX - rect.left - 22;
    dragOffY = clientY - rect.top  - 22;

    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup',   onDragEnd);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend',  onDragEnd);
  }

  // --------------------------------------------------
  // MOVIMENTAÇÃO DO ARRASTO
  // --------------------------------------------------
  function onDragMove(e) {
    if (!isDragging) return;
    e.preventDefault();

    const drag = document.getElementById('draggable');
    const arenaRect = arena.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    // Posição do centro do objeto dentro do arena (em px)
    let newLeft = clientX - arenaRect.left - dragOffX;
    let newTop  = clientY - arenaRect.top  - dragOffY;

    // Limita dentro do arena
    newLeft = Math.max(0, Math.min(arenaRect.width  - 44, newLeft));
    newTop  = Math.max(0, Math.min(arenaRect.height - 44, newTop));

    drag.style.left = newLeft + 'px';
    drag.style.top  = newTop  + 'px';

    // Centro do objeto
    const cx = newLeft + 22, cy = newTop + 22;

    // Verifica colisão com parede
    if (!isInsidePath(cx, cy)) {
      onHitWall();
      return;
    }

    // Verifica chegada ao fim
    if (isAtEnd(cx, cy)) {
      onWin();
    }
  }

  // --------------------------------------------------
  // FIM DO ARRASTO (soltou o mouse/dedo)
  // --------------------------------------------------
  function onDragEnd(e) {
    if (!isDragging) return;
    isDragging = false;
    const drag = document.getElementById('draggable');
    if (drag) drag.classList.remove('dragging');
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup',   onDragEnd);
    document.removeEventListener('touchmove', onDragMove);
    document.removeEventListener('touchend',  onDragEnd);
  }

  // --------------------------------------------------
  // BATEU NA PAREDE
  // --------------------------------------------------
  function onHitWall() {
    if (!gameActive) return;
    onDragEnd();

    lives--;
    livesEl.textContent = lives;

    const drag = document.getElementById('draggable');
    drag.classList.add('error');

    // Vibração (se disponível)
    if (navigator.vibrate) navigator.vibrate(200);

    setTimeout(() => {
      drag.classList.remove('error');
      resetDraggable();

      if (lives <= 0) {
        gameOver();
      }
    }, 600);
  }

  // --------------------------------------------------
  // VENCEU!
  // --------------------------------------------------
  function onWin() {
    if (!gameActive) return;
    gameActive = false;
    clearInterval(timerHandle);
    onDragEnd();

    const drag = document.getElementById('draggable');
    drag.classList.add('win');

    const bonus = timerSec * 2;
    score += 100 + bonus;

    setTimeout(() => {
      launchConfetti();
      showOverlay(true, bonus);
    }, 600);
  }

  // --------------------------------------------------
  // FIM DE JOGO (sem vidas)
  // --------------------------------------------------
  function gameOver() {
    gameActive = false;
    clearInterval(timerHandle);
    showOverlay(false, 0);
  }

  // --------------------------------------------------
  // OVERLAY DE RESULTADO
  // --------------------------------------------------
  function showOverlay(win, bonus) {
    ovEmoji.textContent = win ? '🎉' : '😢';
    ovTitle.textContent = win ? 'Arrasou!'   : 'Que pena!';
    ovSub.textContent   = win
      ? `Você chegou ao fim! Bônus de tempo: +${bonus} pts`
      : 'Suas vidas acabaram. Tente de novo!';
    ovPts.textContent   = win ? `+${100+bonus} pts` : 'Fim de jogo';
    ovPts.className     = 'ov-pts ' + (win ? 'ok' : 'fail');
    btnRestart.className = 'btn-restart ' + (win ? 'ok' : 'fail');
    btnRestart.textContent = win ? '🚀 Jogar de novo' : '🔄 Tentar de novo';
    overlay.classList.add('show');
  }

  // --------------------------------------------------
  // VOLTAR O OBJETO AO INÍCIO
  // --------------------------------------------------
  function resetDraggable() {
    const drag = document.getElementById('draggable');
    if (!drag) return;
    const start = LEVELS[currentLevel].points[0];
    const ps = vbToPx(start.x, start.y);
    drag.style.left = (ps.x - 22) + 'px';
    drag.style.top  = (ps.y - 22) + 'px';
  }

  // --------------------------------------------------
  // INICIALIZAR / REINICIAR JOGO
  // --------------------------------------------------
  function initGame() {
    overlay.classList.remove('show');
    const lv = LEVELS[currentLevel];

    lives    = 3;
    score    = 0;
    timerSec = lv.timeSec;
    gameActive = true;
    isDragging = false;

    livesEl.textContent = lives;
    levelEl.textContent = currentLevel + 1;
    timerEl.textContent = timerSec;
    timerEl.style.color = '';

    buildPath(lv.points, lv.gap);

    // Aguarda o SVG renderizar para calcular dimensões corretas
    requestAnimationFrame(() => {
      placeZones(lv.points);
    });

    // Timer
    clearInterval(timerHandle);
    timerHandle = setInterval(() => {
      timerSec--;
      timerEl.textContent = timerSec;
      if (timerSec <= 10) timerEl.style.color = '#e17055';
      if (timerSec <= 0) {
        clearInterval(timerHandle);
        lives = 0;
        livesEl.textContent = 0;
        gameOver();
      }
    }, 1000);
  }

  // --------------------------------------------------
  // CONFETTI
  // --------------------------------------------------
  function launchConfetti() {
    const wrap = document.getElementById('conf-wrap');
    wrap.innerHTML = '';
    wrap.classList.add('show');
    const cols = ['#FF6B6B','#55EFC4','#FDCB6E','#A29BFE','#74B9FF','#FD79A8'];
    for (let i = 0; i < 55; i++) {
      const c = document.createElement('div');
      c.className = 'conf';
      c.style.left = Math.random() * 100 + '%';
      c.style.top  = '-20px';
      c.style.background = cols[Math.floor(Math.random() * cols.length)];
      const s = 6 + Math.random() * 9;
      c.style.width  = s + 'px';
      c.style.height = s + 'px';
      c.style.animationDelay    = (Math.random() * 0.8) + 's';
      c.style.animationDuration = (0.9 + Math.random() * 0.7) + 's';
      wrap.appendChild(c);
    }
    setTimeout(() => wrap.classList.remove('show'), 2500);
  }

  // --------------------------------------------------
  // EVENTOS
  // --------------------------------------------------

  // Botão reiniciar
  btnRestart.addEventListener('click', initGame);

  // Chips de dificuldade
  document.querySelectorAll('.lv-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.lv-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentLevel = parseInt(chip.dataset.lv);
      initGame();
    });
  });

  // Recalcula posições ao redimensionar
  window.addEventListener('resize', () => {
    const lv = LEVELS[currentLevel];
    buildPath(lv.points, lv.gap);
    requestAnimationFrame(() => placeZones(lv.points));
  });

  // --------------------------------------------------
  // START
  // --------------------------------------------------
  initGame();
  </script>

</body>
</html>
